#HTML5 Input Types: Develop an admission form demonstrating modern input types such as date, email, number, telephone, URL, range, color and file.

<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admission Form</title></head>
<body>
<h1>College Admission Form</h1>
<form>

    <label for="name">
        Name:
    </label>

    <input
        type="text"
        id="name">

    <br><br>

    <label for="email">
        Email:
    </label>

    <input
        type="email"
        id="email">

    <br><br>

    <label for="dob">
        Date of Birth:
    </label>

    <input
        type="date"
        id="dob">

    <br><br>

    <label for="age">
        Age:
    </label>

    <input
        type="number"
        id="age"
        min="16"
        max="60">

    <br><br>

    <label for="phone">
        Mobile Number:
    </label>

    <input
        type="tel"
        id="phone">

    <br><br>

    <label for="website">
        Personal Website:
    </label>

    <input
        type="url"
        id="website">

    <br><br>

    <label for="skill">
        Programming Skill Level:
    </label>

    <input
        type="range"
        id="skill"
        min="0"
        max="10">

    <br><br>

    <label for="color">
        Favourite Color:
    </label>

    <input
        type="color"
        id="color">

    <br><br>

    <label for="resume">
        Upload Resume:
    </label>

    <input
        type="file"
        id="resume">

    <br><br>

    <input
        type="submit"
        value="Submit Application">
</form>
</body></html>
